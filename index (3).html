<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Penentu Nilai Huruf</title>
</head>
<body>
  <h2>Penentu Nilai Huruf</h2>
  <label for="nilai">Masukkan Nilai (0-100):</label>
  <input type="number" id="nilai" placeholder="contoh: 85">
  <button onclick="cekNilai()">Cek</button>

  <p id="hasil"></p>

  <script>
    function cekNilai() {
      let input = document.getElementById("nilai").value;
      let nilai = Number(input);
      let grade;
      let keterangan;

      if (input === "" || nilai < 0 || nilai > 100) {
        alert("Masukkan nilai antara 0 sampai 100!");
        return;
      }

      if (nilai >= 90) {
        grade = "A";
      } else if (nilai >= 80) {
        grade = "B";
      } else if (nilai >= 70) {
        grade = "C";
      } else {
        grade = "D";
      }

      switch (grade) {
        case "A":
          keterangan = "Sangat Baik";
          break;
        case "B":
          keterangan = "Baik";
          break;
        case "C":
          keterangan = "Cukup";
          break;
        default:
          keterangan = "Perlu belajar lagi";
      }

      document.getElementById("hasil").innerHTML =
        "Nilai kamu: " + grade + " (" + keterangan + ")";
    }
  </script>
</body>
</html>
